# Shape only — no passwords. Secrets are created at runtime by:
#   scripts/gen-secrets.sh   (or gen-secrets.ps1)
# which generates a local gitignored .env if needed, then applies Secrets via kubectl.
apiVersion: v1
kind: Secret
metadata:
  name: postgres-ha-credentials
  namespace: postgres-ha
type: Opaque
stringData:
  superuser-password: "<generated>"
  replicator-password: "<generated>"
  admin-password: "<generated>"
  app-password: "<generated>"
---
apiVersion: v1
kind: Secret
metadata:
  name: minio-credentials
  namespace: postgres-ha
type: Opaque
stringData:
  accesskey: "<generated>"
  secretkey: "<generated>"
