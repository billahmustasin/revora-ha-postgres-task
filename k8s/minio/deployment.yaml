apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: minio-data
  namespace: postgres-ha
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 10Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: minio
  namespace: postgres-ha
  labels:
    app: minio
spec:
  replicas: 1
  selector:
    matchLabels:
      app: minio
  template:
    metadata:
      labels:
        app: minio
    spec:
      containers:
        - name: minio
          image: cleanstart/minio:latest
          imagePullPolicy: IfNotPresent
          args: ["server", "/data", "--console-address", ":9001"]
          env:
            - name: MINIO_ROOT_USER
              valueFrom:
                secretKeyRef:
                  name: minio-credentials
                  key: accesskey
            - name: MINIO_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: minio-credentials
                  key: secretkey
          ports:
            - name: api
              containerPort: 9000
            - name: console
              containerPort: 9001
          readinessProbe:
            httpGet:
              path: /minio/health/ready
              port: api
            initialDelaySeconds: 5
            periodSeconds: 5
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          volumeMounts:
            - name: data
              mountPath: /data
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: minio-data
---
apiVersion: v1
kind: Service
metadata:
  name: minio
  namespace: postgres-ha
  labels:
    app: minio
spec:
  selector:
    app: minio
  ports:
    - name: api
      port: 9000
      targetPort: 9000
    - name: console
      port: 9001
      targetPort: 9001
---
# Create the S3 bucket with boto3 (avoids depending on minio/mc image pull).
apiVersion: batch/v1
kind: Job
metadata:
  name: minio-create-bucket
  namespace: postgres-ha
spec:
  ttlSecondsAfterFinished: 120
  template:
    spec:
      restartPolicy: OnFailure
      containers:
        - name: create-bucket
          image: postgres-patroni:16
          imagePullPolicy: Never
          env:
            - name: AWS_ACCESS_KEY_ID
              valueFrom:
                secretKeyRef:
                  name: minio-credentials
                  key: accesskey
            - name: AWS_SECRET_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: minio-credentials
                  key: secretkey
            - name: AWS_ENDPOINT
              value: http://minio.postgres-ha.svc.cluster.local:9000
          command:
            - /opt/patroni-venv/bin/python
            - -c
            - |
              import os, time, boto3
              from botocore.client import Config
              endpoint = os.environ["AWS_ENDPOINT"]
              for i in range(60):
                  try:
                      s3 = boto3.client(
                          "s3",
                          endpoint_url=endpoint,
                          aws_access_key_id=os.environ["AWS_ACCESS_KEY_ID"],
                          aws_secret_access_key=os.environ["AWS_SECRET_ACCESS_KEY"],
                          config=Config(signature_version="s3v4"),
                          region_name="us-east-1",
                      )
                      buckets = [b["Name"] for b in s3.list_buckets().get("Buckets", [])]
                      if "postgres-backups" not in buckets:
                          s3.create_bucket(Bucket="postgres-backups")
                      print("bucket ready:", s3.list_buckets())
                      break
                  except Exception as e:
                      print("waiting for minio:", e)
                      time.sleep(2)
              else:
                  raise SystemExit("minio bucket bootstrap failed")
