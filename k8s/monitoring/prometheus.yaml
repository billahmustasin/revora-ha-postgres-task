apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
  namespace: postgres-ha
data:
  prometheus.yml: |
    global:
      scrape_interval: 15s
      evaluation_interval: 15s
    rule_files:
      - /etc/prometheus/rules/*.yml
    scrape_configs:
      - job_name: postgres
        static_configs:
          - targets:
              - postgres-exporter:9187
      - job_name: patroni
        metrics_path: /metrics
        static_configs:
          - targets:
              - postgres-ha-0.postgres-ha-pods:8008
              - postgres-ha-1.postgres-ha-pods:8008
              - postgres-ha-2.postgres-ha-pods:8008
  alerts.yml: |
    groups:
      - name: postgres-ha
        rules:
          - alert: PostgresNoPrimary
            expr: pg_up == 0
            for: 1m
            labels:
              severity: critical
            annotations:
              summary: "postgres_exporter cannot scrape primary"
          - alert: PostgresReplicationLagHigh
            expr: pg_replication_lag > 32
            for: 2m
            labels:
              severity: warning
            annotations:
              summary: "Replication lag > 32 bytes-seconds threshold (exporter units)"
          - alert: PatroniMemberDown
            expr: up{job="patroni"} == 0
            for: 1m
            labels:
              severity: critical
            annotations:
              summary: "A Patroni member is unreachable"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: prometheus
  namespace: postgres-ha
  labels:
    app: prometheus
spec:
  replicas: 1
  selector:
    matchLabels:
      app: prometheus
  template:
    metadata:
      labels:
        app: prometheus
    spec:
      containers:
        - name: prometheus
          image: prom/prometheus:v2.55.1
          args:
            - --config.file=/etc/prometheus/prometheus.yml
            - --storage.tsdb.path=/prometheus
            - --storage.tsdb.retention.time=24h
          ports:
            - containerPort: 9090
              name: http
          readinessProbe:
            httpGet:
              path: /-/ready
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
          volumeMounts:
            - name: config
              mountPath: /etc/prometheus/prometheus.yml
              subPath: prometheus.yml
            - name: config
              mountPath: /etc/prometheus/rules/alerts.yml
              subPath: alerts.yml
      volumes:
        - name: config
          configMap:
            name: prometheus-config
---
apiVersion: v1
kind: Service
metadata:
  name: prometheus
  namespace: postgres-ha
spec:
  selector:
    app: prometheus
  ports:
    - name: http
      port: 9090
      targetPort: 9090
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres-exporter
  namespace: postgres-ha
  labels:
    app: postgres-exporter
spec:
  replicas: 1
  selector:
    matchLabels:
      app: postgres-exporter
  template:
    metadata:
      labels:
        app: postgres-exporter
    spec:
      containers:
        - name: exporter
          image: quay.io/prometheuscommunity/postgres-exporter:v0.16.0
          env:
            - name: DATA_SOURCE_URI
              value: postgres-ha.postgres-ha.svc.cluster.local:5432/postgres?sslmode=disable
            - name: DATA_SOURCE_USER
              value: postgres
            - name: DATA_SOURCE_PASS
              valueFrom:
                secretKeyRef:
                  name: postgres-ha-credentials
                  key: superuser-password
          ports:
            - containerPort: 9187
              name: metrics
          readinessProbe:
            httpGet:
              path: /
              port: metrics
            initialDelaySeconds: 5
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: postgres-exporter
  namespace: postgres-ha
spec:
  selector:
    app: postgres-exporter
  ports:
    - name: metrics
      port: 9187
      targetPort: 9187
